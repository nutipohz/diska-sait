<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Побег из дома — Диська</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grain"></div>
<main id="site"></main>
<noscript>Для просмотра сайта необходимо включить JavaScript.</noscript>
<script>
const sections=['header','hero','antagonist','features','difficulty','ranks','controls','requirements','gallery','credits','status','footer','lightbox'];
const site=document.getElementById('site');
Promise.all(sections.map(name=>fetch('sections/'+name+'.html').then(r=>{if(!r.ok)throw new Error(name);return r.text()})))
.then(parts=>{site.innerHTML=parts.join('\n');const s=document.createElement('script');s.src='js/main.js';document.body.appendChild(s)})
.catch(err=>{console.error(err);site.innerHTML='<section class="section"><div class="status-box"><strong>Не удалось загрузить страницу.</strong><br><span style="color:var(--muted)">Попробуйте обновить страницу.</span></div></section>'});
</script>
</body>
</html>
