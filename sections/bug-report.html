<section class="section" id="bug-report">
  <div class="section-head">
    <div class="eyebrow">BUG REPORT</div>
    <h2>Сообщить об ошибке</h2>
    <p>Нашли баг? Опишите его — сообщение будет отправлено разработчику.</p>
  </div>

  <form class="bug-form" id="bugReportForm">
    <div class="bug-form-grid">
      <label class="bug-field">
        <span>📱 Устройство</span>
        <input id="bugDevice" name="device" type="search" list="androidDeviceList" placeholder="Начните вводить модель телефона" autocomplete="off" required>
        <datalist id="androidDeviceList"></datalist>
        <small class="bug-hint" id="bugDeviceHint">Загрузка базы Android-устройств…</small>
      </label>

      <label class="bug-field">
        <span>🤖 Android</span>
        <select id="bugAndroid" name="android" required>
          <option value="">Выберите версию</option>
          <option>Android 7.0</option><option>Android 7.1</option>
          <option>Android 8.0</option><option>Android 8.1</option>
          <option>Android 9</option><option>Android 10</option><option>Android 11</option>
          <option>Android 12</option><option>Android 12L</option><option>Android 13</option>
          <option>Android 14</option><option>Android 15</option><option>Android 16</option><option>Android 17</option>
        </select>
        <small class="bug-hint">Только Android 7.0+ — минимальное требование игры.</small>
      </label>    </div>

    <label class="bug-field">
      <span>🐛 Что произошло?</span>
      <textarea id="bugDescription" name="description" rows="5" placeholder="Опишите ошибку как можно понятнее" required></textarea>
    </label>

    <label class="bug-field">
      <span>🔁 Как повторить?</span>
      <textarea id="bugSteps" name="steps" rows="4" placeholder="Например: 1. Открыл игру 2. Нажал ..."></textarea>
    </label>

    <div class="bug-actions">
      <button class="btn btn-primary" type="submit" id="bugSubmit">🐛 Отправить баг-репорт</button>
      <span class="bug-status" id="bugStatus" aria-live="polite"></span>
    </div>
  </form>
</section>
