<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка — Побег из дома — Диська</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2f2f2;font-family:Arial,sans-serif;padding:24px}
main{max-width:900px;margin:0 auto}
h1{font-size:clamp(28px,6vw,46px);margin:0 0 8px}
p{color:#aeb3ba;line-height:1.55}
.panel{background:#15171b;border:1px solid #292d34;border-radius:18px;padding:22px;margin-top:22px}
label{display:block;margin:14px 0;color:#d8dbe0}
input{display:block;width:100%;margin-top:7px;padding:13px 14px;border-radius:10px;border:1px solid #363b44;background:#0e1013;color:#fff;font-size:16px}
button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#eee;color:#111;font-weight:700;cursor:pointer}
.status{color:#ff8d8d;margin-top:12px;min-height:20px}
.bug-card{background:#0f1114;border:1px solid #2a2f36;border-radius:14px;padding:18px;margin:14px 0}
.bug-card p{margin:10px 0}
.bug-card-top{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #272b31;padding-bottom:10px}
time{color:#8f969f;font-size:13px}
a{color:#fff}
</style>
</head>
<body>
<main>
  <p><a href="./">← Вернуться на сайт</a></p>
  <h1>Панель багов</h1>
  <p>Закрытая страница разработчика.</p>

  <section class="panel" id="loginBox">
    <h2>Вход</h2>
    <form id="loginForm">
      <label>Почта<input id="email" type="email" autocomplete="username" required></label>
      <label>Пароль<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Войти</button>
      <div class="status" id="loginStatus"></div>
    </form>
  </section>

  <section class="panel" id="bugsBox" hidden>
    <button id="logoutBtn" type="button">Выйти</button>
    <h2>Баг-репорты</h2>
    <div id="bugsList">Загрузка...</div>
  </section>
</main>
<script type="module" src="./admin.js"></script>
</body>
</html>
